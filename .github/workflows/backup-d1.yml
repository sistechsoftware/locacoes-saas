# Backup diário do D1 — produção e staging (pendência #09).
#
# Roda todo dia 03:00 UTC e também sob demanda (workflow_dispatch).
# Usa scripts/db-backup.mjs, que exporta, valida o dump, assina (SHA-256),
# envia para o bucket R2 de backups COM `--remote`, baixa o objeto de volta do
# R2 remoto para conferir o SHA-256 e só então registra o manifesto e poda os
# arquivos locais além da retenção de 30 dias.
#
# Secrets necessários no repositório (ver RUNBOOK-BACKUP-D1.md §3.2):
#   CLOUDFLARE_API_TOKEN     token com permissão "D1:Read" e "Workers R2:Edit"
#   CLOUDFLARE_ACCOUNT_ID    id da conta Cloudflare
#
# Sem esses secrets o job falha de propósito (o backup é obrigatório e a
# falha precisa aparecer, não ficar silenciosa). O passo "Verificar secrets"
# acusa a ausência ANTES de qualquer export, com instrução de correção.
#
# Auditoria de 2026-10-12: as execuções 1/2/3 falhavam porque os dois secrets
# acima nunca foram criados (total_count 0 em GET /actions/secrets) — o wrangler
# abortava no primeiro comando. Mesmo com o secret correto, o upload do script
# não usava `--remote` e caía no R2 simulado local; os dois pontos estão
# corrigidos aqui e em scripts/db-backup.mjs.

name: Backup diário do D1

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 00:00 (meia-noite) horário de Brasília
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar secrets do Cloudflare
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          faltando=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN não existe no repositório."
            faltando=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID não existe no repositório."
            faltando=1
          fi
          if [ "$faltando" -ne 0 ]; then
            echo "::error::Backup NÃO foi gerado. Configure os secrets em Settings -> Secrets and variables -> Actions (RUNBOOK-BACKUP-D1.md §3.2). Falha real: ficar silenciosa seria pior."
            exit 1
          fi
          echo "Secrets presentes (valores não exibidos)."

      - name: Backup de produção
        id: backup_producao
        run: npm run db:backup:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Backup de staging
        id: backup_staging
        # Cópias independentes: uma falha do backup de produção não pode
        # impedir a cópia de staging (o job continua falhando — a falha real
        # permanece visível no resultado final). Só pula se não há credencial.
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: npm run db:backup:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar manifesto como artefato (auditoria dos 30 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifesto-backup-d1
          path: backups/manifesto.log
          # warn (antes: ignore): manifesto ausente é sintoma, não normal.
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo da execução (diagnóstico)
        if: always()
        run: |
          {
            echo "## Backup diário do D1 — $(date -u +%FT%TZ)"
            echo "- Gatilho: \`${{ github.event_name }}\` · execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Verificação de secrets: ${{ steps.secrets.outcome }}"
            echo "- Backup de produção: ${{ steps.backup_producao.conclusion || 'não executado' }}"
            echo "- Backup de staging: ${{ steps.backup_staging.conclusion || 'não executado' }}"
            echo ""
            echo "### Manifesto desta execução"
            if [ -f backups/manifesto.log ]; then
              echo '```'
              cat backups/manifesto.log
              echo '```'
            else
              echo "_Sem linhas no manifesto: nenhum backup foi concluído nesta execução._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
